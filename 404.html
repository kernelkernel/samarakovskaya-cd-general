<script type="text/javascript">
    /* Метка собственных визитов. Не зависит от IP и страны VPN:
       флаг хранится в localStorage конкретного браузера.
       Включить метку:  https://t.samarakovskaya.art/?me=1
       Снять метку:     https://t.samarakovskaya.art/?me=0
       Помеченные визиты видны в Метрике как параметр визита owner = tanya. */

        try{
            var p = new URLSearchParams(location.search).get('me');
            if(p !== null){
                if(p === '0' || p === 'off'){ localStorage.removeItem('ym_owner'); }
                else { localStorage.setItem('ym_owner','1'); }
                var on = localStorage.getItem('ym_owner') === '1';
                document.addEventListener('DOMContentLoaded', function(){
                    var n = document.createElement('div');
                    n.textContent = on ? 'Метрика: визиты помечены как OWNER' : 'Метрика: метка OWNER снята';

                    document.body.appendChild(n);
                    setTimeout(function(){ n.remove(); }, 4000);
                });
            }
        }catch(e){}
    })();
